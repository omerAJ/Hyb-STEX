## global
seed: 1
device: cuda
mode: train
best_path: E:\estudy\hybstex-code\Hyb-STEX\saved_weights\NYCTaxi-p4.pth
debug: False
training_recipe: full

## data
data_dir: data
dataset: NYCTaxi
evs_key: evs_90 # evaluation-only extreme-event labels for EEE
input_length: 17
batch_size: 128
test_batch_size: 256
graph_file: data/NYCTaxi/adj_mx.npz # num_nodes 200 (20 x 10)
num_nodes: 200
row: 20
col: 10

## model
d_input: 2 # means inflow and outflow
d_output: 2 # means inflow and outflow
d_model: 64
dropout: 0.1
percent: 0.1 # augumentation percentage
shm_temp: 0.5 # temperature for loss of spatial heterogeneity modeling  , 0.5 is best for NYCBike
nmb_prototype: 4 # number of clusters
yita: 0.5 # balance for inflow loss and outflow loss, $yita * inflow + (1 - yita) * outflow$
tail_threshold_q: 0.95
tail_lambda_cls: 1.0
tail_lambda_gpd: 1.0
tail_mae_weight: 0.0
tail_schedule: static
tail_classifier_loss_type: bce
tail_pos_weight_multiplier: 1.0
tail_focal_gamma: 2.0
tail_focal_alpha_pos: 0.75
tail_xi_min: -0.5
tail_xi_max: -0.02
tail_eps: 1.0e-6
joint_refine_epochs: 200
joint_refine_early_stop_patience: 15
joint_refine_pred_lr_scale: 0.1
joint_refine_classifier_lr_scale: 1.0
joint_refine_gpd_lr_scale: 1.0
joint_refine_lambda_cls: 0.05
joint_refine_lambda_gpd: 1.0
joint_refine_lambda_mae: 0.15
joint_refine_recompute_tail_u: False

## train
start_epoch: 0
num_epochs: 1000
epochs: 1000
lr_init: 0.001
early_stop: True
early_stop_patience: 35
grad_norm: True
max_grad_norm: 5
use_dwa: True # whether to use dwa for loss balance
temp: 2 # tempurature parameter in dwa, a larger T means more similer weights
