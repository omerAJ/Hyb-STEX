## global
seed: 1
device: cuda
mode: train
best_path: external/STLAformer-data/data/PEMS04/best_model_placeholder.pth
debug: False
training_recipe: full

## data
data_dir: external/STLAformer-data/data
dataset: PEMS04
evs_key:
pems04_evs_quantile: 0.95
input_length: 12
output_length: 12
batch_size: 64
test_batch_size: 128
graph_file: external/STLAformer-data/data/PEMS04/adj_mx.npz
num_nodes: 307
row: 1
col: 307

## model
d_input: 2
d_output: 1
d_model: 64
dropout: 0.1
percent: 0.1
shm_temp: 0.5
nmb_prototype: 4
yita: 1.0
tail_threshold_q: 0.90
tail_lambda_cls: 1.0
tail_lambda_gpd: 1.0
tail_mae_weight: 0.0
tail_phase_selection_metric: corrected_mae
tail_schedule: static_then_joint
tail_magnitude_mode: point_excess
tail_classifier_loss_type: bce
tail_pos_weight_multiplier: 1.0
tail_focal_gamma: 2.0
tail_focal_alpha_pos: 0.75
tail_xi_min: -0.5
tail_xi_max: -0.02
tail_eps: 1.0e-6
joint_refine_epochs: 20
joint_refine_early_stop_patience: 10
joint_refine_pred_lr_scale: 0.1
joint_refine_classifier_lr_scale: 1.0
joint_refine_gpd_lr_scale: 1.0
joint_refine_lambda_cls: 0.05
joint_refine_lambda_gpd: 0.10
joint_refine_lambda_mae: 1.0
joint_refine_recompute_tail_u: False

## train
start_epoch: 0
num_epochs: 200
epochs: 200
base_epochs: 200
base_early_stop_patience: 20
tail_stage1_epochs: 40
tail_stage1_early_stop_patience: 10
lr_init: 0.001
early_stop: True
early_stop_patience: 20
grad_norm: True
max_grad_norm: 5
use_dwa: True
temp: 2
